name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push makes the older run's result useless.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No test reads debug info, and without it the workspace builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Pun's own crates at opt-level 1: the tests run about twice as fast, for a minute more of building.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  # The PCRE2 the release binaries bundle, not the runner's older system library.
  PCRE2_SYS_STATIC: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: rule mapping and generated docs
        run: |
          python3 scripts/check-rule-mapping.py
          python3 scripts/test-rule-docs.py
          python3 scripts/gen-rule-docs.py --check
      # POSIX sh only: the installer runs under dash, BusyBox ash and macOS's sh.
      - name: shellcheck the installer
        run: shellcheck -s sh docs/public/install
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/oracle
      # pun-cli's tests run Pint's and Pun's Blade preflight with a Bun lock file.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-on-failure: true
      # pun-phpstan's corpus_configs reads these four projects' phpstan configs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
            corpus/larastan
            corpus/laravel-pint
          key: corpus4-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework larastan laravel-pint
      - uses: taiki-e/install-action@e800962fea8b802cd1bd32c4e6f08fbda4bb0048 # nextest
        with:
          tool: nextest
      - run: cargo nextest run --workspace --exclude punphp-analyse --locked --no-fail-fast

  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: analyse
          cache-on-failure: true
      - uses: taiki-e/install-action@e800962fea8b802cd1bd32c4e6f08fbda4bb0048 # nextest
        with:
          tool: nextest
      - run: cargo nextest run -p punphp-analyse --locked --no-fail-fast

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: parity
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      - run: cargo build --locked -p punphp -p punphp-harness
      - run: target/debug/pun-harness format --corpus pinkary --corpus laravel-framework --diffs 20

  # The other jobs run on Linux, but the release also builds macOS archives (dist-workspace.toml), so code behind
  # cfg(target_os = "macos") compiles here first: v0.2.2's macOS build failed after it was tagged. Rust 1.100, as the
  # release (.github/build-setup.yml). macos-15 is arm64; x86_64 is checked as a cross target.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos
          cache-on-failure: true
      - run: cargo build --locked -p punphp
      - run: target/debug/pun --version
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked -p punphp --target x86_64-apple-darwin
      # The package store's clonefile path runs only on APFS, so its tests run here too. The platform probe and
      # script tests run php, which the macOS runner doesn't have.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: cargo test --locked -p punphp-packages

  # Native x86_64. Unix-only integration tests are cfg'd out; the analyse suite stays on the Linux job (it is the
  # same cases, and it needs the corpus). This job still typechecks those tests.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows
          cache-on-failure: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Build pun.exe
        run: cargo build --locked -p punphp
        env:
          PCRE2_SYS_STATIC: "1"
      - name: pun --version
        run: .\target\debug\pun.exe --version
      - name: Test
        run: |
          cargo test --locked --workspace --exclude punphp-analyse --exclude punphp-harness --exclude punphp -- --test-threads=8
          cargo test --locked -p punphp --lib
        env:
          PCRE2_SYS_STATIC: "1"
      - name: Typecheck the suites that run on Linux
        run: |
          cargo check --locked -p punphp --tests
          cargo check --locked -p punphp-analyse --tests
          cargo check --locked -p punphp-harness --tests
        env:
          PCRE2_SYS_STATIC: "1"
      - name: Compile the Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DPunExe=$PWD\target\debug\pun.exe" "/DPunVersion=0.4.3" "$PWD\packaging\windows\pun.iss"
          if (-not (Test-Path target\windows\pun-setup-x86_64.exe)) { throw "installer was not produced" }

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: parity
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      # Pinkary's pint.json enables Pint/laravel_blade, which needs prettier.
      - run: npm install --prefix corpus/pinkary --no-audit --no-fund
      - run: cargo build --locked -p punphp
      # Fixed seeds, so a failure reproduces locally with the same command (scripts/fuzz-parity.sh header).
      # The four runs use separate scratch directories, so they run side by side.
      - run: |
          echo '{"preset": "laravel"}' > /tmp/laravel.json
          scripts/fuzz-parity.sh corpus/pinkary 1 app tests database config routes & pids=($!)
          scripts/fuzz-parity.sh corpus/pinkary 2 app tests database config routes & pids+=($!)
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 3 src/Illuminate/Support src/Illuminate/Collections & pids+=($!)
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 4 src/Illuminate/Database/Query tests/Support & pids+=($!)
          status=0; for pid in "${pids[@]}"; do wait "$pid" || status=1; done; exit $status
